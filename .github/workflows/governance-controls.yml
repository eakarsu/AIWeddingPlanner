name: Governance controls
on: [push, pull_request]
permissions: { contents: read }
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax
        run: |
          node --check backend/server.js
          node --check backend/governance/index.js
          node --check backend/governance/domain.js
          node --check backend/governance/router.js
          node --check backend/governance/policy.js
          node --check backend/routes/auth.js
          node --check backend/middleware/auth.js
          node --check backend/seed.js
          bash -n start.sh
      - name: Governance and workflow tests
        run: node --test backend/governance/tests/*.test.js
